<svg viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cross gradient: light-green → dark-green diagonal -->
    <linearGradient id="ml-cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#72DC84"/>
      <stop offset="55%"  stop-color="#29AD47"/>
      <stop offset="100%" stop-color="#16712E"/>
    </linearGradient>

    <!-- Pill green half -->
    <linearGradient id="ml-pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#62D474"/>
      <stop offset="100%" stop-color="#1D9038"/>
    </linearGradient>

    <!-- Pill blue half -->
    <linearGradient id="ml-pb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#58B8FA"/>
      <stop offset="100%" stop-color="#1258CC"/>
    </linearGradient>

    <!-- "Med" text: light-green → dark-green -->
    <linearGradient id="ml-tg" x1="0" y1="18" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#54CA65"/>
      <stop offset="100%" stop-color="#16712E"/>
    </linearGradient>

    <!-- "Link" text: light-blue → dark-blue -->
    <linearGradient id="ml-tb" x1="0" y1="18" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#58B8FA"/>
      <stop offset="100%" stop-color="#1258CC"/>
    </linearGradient>
  </defs>

  <!-- ── Icon (126×126 grid, offset 7,7) ───────────────────────────────── -->
  <g transform="translate(7,7)">

    <!-- Green medical cross with rounded outer corners (r=9) -->
    <!-- Arms: vertical x=43..83, horizontal y=43..83, spanning 6..120 -->
    <path fill="url(#ml-cross)"
          d="M52 6
             Q 43 6, 43 15
             V 43 H 15
             Q 6 43, 6 52
             V 74
             Q 6 83, 15 83
             H 43 V 111
             Q 43 120, 52 120
             H 74
             Q 83 120, 83 111
             V 83 H 111
             Q 120 83, 120 74
             V 52
             Q 120 43, 111 43
             H 83 V 15
             Q 83 6, 74 6
             Z"/>

    <!-- Pill capsule, rotated −40° around icon center (63,63) -->
    <g transform="rotate(-40,63,63)">
      <!-- Green (left) half -->
      <path fill="url(#ml-pg)"
            d="M39 40 L63 40 L63 86 L39 86 A23 23 0 1 1 39 40 Z"/>
      <!-- Blue (right) half -->
      <path fill="url(#ml-pb)"
            d="M63 40 L87 40 A23 23 0 1 1 87 86 L63 86 Z"/>
      <!-- White + on the blue half (centred ~87,63) -->
      <rect x="78"  y="60" width="19" height="6" rx="3" fill="white"/>
      <rect x="84"  y="54" width="6"  height="18" rx="3" fill="white"/>
    </g>
  </g>

  <!-- ── "MedLink" wordmark ─────────────────────────────────────────────── -->
  <text x="150" y="96"
        font-family="'Arial Black','Impact','Helvetica Neue',Arial,sans-serif"
        font-weight="900" font-size="76" letter-spacing="-1">
    <tspan fill="url(#ml-tg)">Med</tspan><tspan fill="url(#ml-tb)">Link</tspan>
  </text>

  <!-- ── "PHARMACY MANAGEMENT" subtitle ────────────────────────────────── -->
  <text x="154" y="121"
        font-family="Arial,'Helvetica Neue',sans-serif"
        font-weight="600" font-size="15"
        fill="#9CA5AF" letter-spacing="3.5">PHARMACY MANAGEMENT</text>
</svg>
